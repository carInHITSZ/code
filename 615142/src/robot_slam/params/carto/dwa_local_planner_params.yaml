DWAPlannerROS:

# Robot Configuration Parameters - Kobuki
  max_vel_x: 5
  min_vel_x: -5

  max_vel_y: 5        #5
  min_vel_y: -5        #-5

  max_rot_vel: 2.5
  min_rot_vel: 0.5

  max_vel_trans: 6.5   #5 #0.5
  min_vel_trans: 0.1 #0.025


  max_vel_theta: 2.5
  min_vel_theta: 1.4 #0.4
  
  acc_lim_x: 3.0 
  acc_lim_theta: 3.5
  acc_lim_y: 3.0 

  xy_goal_tolerance: 0.1 #0.03
  yaw_goal_tolerance: 0.04 #0.015
  latch_xy_goal_tolerance: false

# Forward Simulation Parameters
  sim_time: 1.0    #2.0      
  vx_samples: 8    #11  
  vy_samples: 8    #11
  vth_samples: 6
  controller_frequency: 10.0

# Trajectory Scoring Parameters
  path_distance_bias: 36.0     #default:36
  goal_distance_bias: 24.0     #default:24
  occdist_scale: 0.02       
  forward_point_distance: 0.325 
  stop_time_buffer: 0.2  
  scaling_speed: 0.25   
  max_scaling_factor: 0.2 

# Oscillation Prevention Parameters
  oscillation_reset_dist: 0.01  

# Debugging
  publish_traj_pc : true
  publish_cost_grid_pc: true

# Differential-drive robot configuration - necessary?
  holonomic_robot: true

